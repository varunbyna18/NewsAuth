name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Lint code
        run: cd backend && npm run lint 2>/dev/null || echo "No lint script"

      - name: Run tests
        run: cd backend && npm test 2>/dev/null || echo "No tests configured"

      - name: Build
        run: cd backend && npm run build 2>/dev/null || echo "No build needed"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: ./backend

      - name: Configure environment variables
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          app-settings-json: |
            [
              {
                "name": "NODE_ENV",
                "value": "production",
                "slotSetting": false
              },
              {
                "name": "AZURE_ENDPOINT",
                "value": "${{ secrets.AZURE_ENDPOINT }}",
                "slotSetting": false
              },
              {
                "name": "AZURE_KEY",
                "value": "${{ secrets.AZURE_KEY }}",
                "slotSetting": false
              },
              {
                "name": "PINATA_API_KEY",
                "value": "${{ secrets.PINATA_API_KEY }}",
                "slotSetting": false
              },
              {
                "name": "PINATA_SECRET",
                "value": "${{ secrets.PINATA_SECRET }}",
                "slotSetting": false
              },
              {
                "name": "SEPOLIA_RPC_URL",
                "value": "${{ secrets.SEPOLIA_RPC_URL }}",
                "slotSetting": false
              },
              {
                "name": "PRIVATE_KEY",
                "value": "${{ secrets.PRIVATE_KEY }}",
                "slotSetting": false
              },
              {
                "name": "CONTRACT_ADDRESS",
                "value": "${{ secrets.CONTRACT_ADDRESS }}",
                "slotSetting": false
              }
            ]

      - name: Health Check
        run: |
          for i in {1..10}; do
            if curl -f https://${{ secrets.AZURE_APP_SERVICE_NAME }}.azurewebsites.net/health; then
              echo "✅ App is healthy"
              exit 0
            fi
            echo "⏳ Waiting for app to come online ($i/10)..."
            sleep 10
          done
          echo "❌ App failed to start"
          exit 1
